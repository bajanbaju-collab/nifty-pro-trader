services:
  - type: web
    name: nifty-pro-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: EXECUTION_MODE
        value: demo
      - key: ENABLE_LIVE_ORDERS
        value: 'false'
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: ALLOWED_KITE_USER_ID
        sync: false
