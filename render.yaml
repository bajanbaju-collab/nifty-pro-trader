services:
  - type: web
    name: nifty-pro-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: EXECUTION_MODE
        value: demo
      - key: ENABLE_LIVE_ORDERS
        value: 'false'
